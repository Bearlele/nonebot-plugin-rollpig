name: Validate pig.json

on:
  pull_request:
    paths:
      - '.nonebot_plugin_rollpig/resource/pig.json'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate pig.json rules
        run: |
          python <<EOF
          import json
          import sys

          file_path = ".nonebot_plugin_rollpig/resource/pig.json"

          # 检查 JSON 语法
          try:
              with open(file_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"❌ JSON 格式错误: {e}")
              sys.exit(1)

          if not isinstance(data, list):
              print("❌ pig.json 必须是数组结构 []")
              sys.exit(1)

          ids = set()
          error = False

          for index, item in enumerate(data):

              if not isinstance(item, dict):
                  print(f"❌ 第 {index} 项不是 JSON 对象")
                  error = True
                  continue

              if "id" not in item:
                  print(f"❌ 第 {index} 项缺少 id 字段")
                  error = True
                  continue

              _id = item["id"]

              if _id.strip() == "":
                  print(f"❌ 第 {index} 项 id 不能为空")
                  error = True

              if " " in _id:
                  print(f"❌ 第 {index} 项 id 不能包含空格: '{_id}'")
                  error = True

              if _id in ids:
                  print(f"❌ 发现重复 id: '{_id}' (index {index})")
                  error = True
              else:
                  ids.add(_id)

          if error:
              sys.exit(1)

          print("✅ pig.json 校验通过")
          EOF