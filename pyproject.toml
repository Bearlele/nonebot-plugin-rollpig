[project]
name = "nonebot_plugin_rollpig"
version = "0.2.9"
description = "今天是什么小猪"
authors = [{ name = "Bear_lele", email = "lele2587342146@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "nonebot2 >= 2.4.0",
    "nonebot-plugin-htmlrender >= 0.6.7",
    "nonebot-plugin-apscheduler >= 0.5.0",
    "nonebot-plugin-localstore >= 0.7.4",
    "httpx>=0.27.0",
    "nonebot-plugin-alconna>=0.61.0",
    "nonebot-plugin-uninfo>=0.11.0",
]

[dependency-groups]
dev = [
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot2[fastapi]>=2.4.0",
]

[project.urls]
homepage = "https://github.com/Bearlele/nonebot-plugin-rollpig"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
[tool.nonebot.plugins]
nonebot_plugin_rollpig = ["nonebot_plugin_rollpig"]

[tool.isort]
profile = "black"
line_length = 120
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
extra_standard_library = ["typing_extensions"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q"]
ignore = ["E402", "C901"]